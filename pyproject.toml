[project]
name = "auditable-sql"
version = "0.1.0"
description = "Reference implementation of an auditable natural-language-to-SQL system for investment portfolio data"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.70",
    "sqlglot>=26.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "numpy>=2.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
ui = ["streamlit>=1.38", "pandas>=2.2"]

[project.scripts]
asql = "auditable_sql.interfaces.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "testcontainers[postgres]>=4.8",
    "import-linter>=2.1",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auditable_sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs Docker (spins up PostgreSQL via testcontainers)",
]

[tool.coverage.run]
source = ["src/auditable_sql"]
omit = ["src/auditable_sql/interfaces/streamlit_app.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["auditable_sql"]

[[tool.mypy.overrides]]
module = ["sqlglot.*", "testcontainers.*", "streamlit.*", "pandas.*"]
ignore_missing_imports = true

# Clean Architecture dependency rule, enforced in CI.
[tool.importlinter]
root_package = "auditable_sql"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers point inward only"
type = "layers"
layers = [
    "auditable_sql.bootstrap",
    "auditable_sql.interfaces",
    "auditable_sql.infrastructure",
    "auditable_sql.application",
    "auditable_sql.domain",
]

[[tool.importlinter.contracts]]
name = "Domain and application stay framework-free"
type = "forbidden"
source_modules = ["auditable_sql.domain", "auditable_sql.application"]
forbidden_modules = ["anthropic", "sqlglot", "psycopg", "yaml", "numpy", "typer", "streamlit", "pydantic_settings"]

[tool.ruff.lint.per-file-ignores]
# Adversarial SQL cases read best one per line.
"tests/**" = ["E501"]
